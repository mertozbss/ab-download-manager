name: Build Windows (mertozbss)

# Kendi derlememiz: sadece Windows x64, imzasız.
# - Elle çalıştırma (Actions > Run workflow) -> artifact olarak indirilebilir build
# - vX.Y.Z tag'i push edilince -> bu fork'ta Release oluşturur (uygulama içi güncelleme buraya bakar)

on:
  workflow_dispatch:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  # PR'lar da CI'dan geçmeli (Release adımı sadece tag push'ta çalışır)
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # gradle-wrapper.jar'ın resmi Gradle dağıtımıyla birebir aynı olduğunu doğrular
      - uses: gradle/actions/wrapper-validation@v4

  security-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: "jetbrains"
          java-package: "jdk"
          java-version: "25"
          check-latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Yerel API güvenlik testleri (koruma açık -> hepsi geçmeli)
        env:
          SKIP_ANDROID_BUILD: "true"
        run: ./gradlew :integration:server:test --no-configuration-cache
      - name: YouTube (yt-dlp) birim testleri (argüman, URL, ilerleme, hash doğrulama, dosya adı)
        env:
          SKIP_ANDROID_BUILD: "true"
        run: ./gradlew :downloader:core:desktopTest --no-configuration-cache
      - name: Kontrol testi (koruma kapatılınca saldırı testleri KALMALI)
        env:
          SKIP_ANDROID_BUILD: "true"
        run: |
          F=integration/server/src/main/kotlin/com/abdownloadmanager/integration/Endpoints.kt
          sed -i 's/^\(\s*\)install(LocalRequestGuard)/\1\/\/ guard disabled for control test/' "$F"
          if ./gradlew :integration:server:test --no-configuration-cache > control.log 2>&1; then
            echo "::error::Koruma kapalıyken saldırı testleri geçti -> testler saldırıyı yakalamıyor"; exit 1
          fi
          grep -E "FAILED|tests completed" control.log || true
          echo "OK: koruma olmadan saldırı başarılı oluyor, koruma ile engelleniyor"
          git checkout -- "$F"

  android-compile:
    # ytdlp sadece desktop'ta kayıtlı; Android modülü derlenmeye devam etmeli
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: "jetbrains"
          java-package: "jdk"
          java-version: "25"
          check-latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Android Kotlin derlemesi
        run: ./gradlew :android:app:compileDebugKotlin --no-configuration-cache

  build-windows:
    needs: [supply-chain, security-tests]
    runs-on: windows-2022
    steps:
      - name: Checkout (tag'ler dahil; sürüm numarası git tag'inden okunuyor)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JBR
        uses: actions/setup-java@v5
        with:
          distribution: "jetbrains"
          java-package: "jdk"
          java-version: "25"
          check-latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        shell: bash
        env:
          SKIP_ANDROID_BUILD: "true"
        run: ./gradlew createReleaseFolderForCi

      - name: Paketlenmiş uygulamada riskli kütüphane kontrolü
        shell: bash
        run: |
          JARS=$(find desktop/app/build -name '*.jar' -path '*binaries*' | sed 's#.*/##' | sort -u)
          echo "Paketteki jar sayısı: $(echo "$JARS" | grep -c . || true)"
          if echo "$JARS" | grep -iE 'netty|bcprov|bouncycastle|jdom|jose4j|guava'; then
            echo "::warning::Dependabot uyarılarındaki kütüphanelerden biri pakete girmiş"
          else
            echo "OK: netty / bouncycastle / jdom / jose4j / guava pakette yok (uyarılar sadece derleme ortamında)"
          fi

      - name: Checksums
        shell: bash
        run: |
          cd build/ci-release/binaries
          sha256sum * | tee SHA256SUMS.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: abdm-windows-x64
          path: build/ci-release

      - name: Create release (sadece tag push'ta)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          make_latest: true
          files: build/ci-release/binaries/*
          body_path: build/ci-release/release-notes.md

  dependency-graph:
    # Çözümlenmiş tüm Gradle bağımlılıklarını GitHub'a bildirir -> Dependabot güvenlik uyarıları çalışır
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: "jetbrains"
          java-package: "jdk"
          java-version: "25"
          check-latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: gradle/actions/dependency-submission@v4
        env:
          SKIP_ANDROID_BUILD: "true"
